version: "3.8"

services:
  codewave:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codewave-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      # Маунтим логи для отладки (опционально)
      - ./logs:/app/logs
    networks:
      - codewave-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx для проксирования (опционально)
  nginx:
    image: nginx:alpine
    container_name: codewave-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - codewave
    networks:
      - codewave-network
    restart: unless-stopped

networks:
  codewave-network:
    driver: bridge

volumes:
  logs:
